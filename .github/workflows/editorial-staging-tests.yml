name: Editorial staging offline tests
on:
  pull_request:
    paths:
      - 'scripts/stage_daily_content.py'
      - 'scripts/test_stage_daily_content.py'
      - '.github/workflows/editorial-staging-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline staging tests
        run: python scripts/test_stage_daily_content.py
