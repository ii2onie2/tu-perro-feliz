name: Gemini Draft Artifact QA
on:
  push:
    branches: [integration/indiepost-premium-audit-20261015]
    paths: [.github/workflows/gemini-draft-artifact-qa.yml]
permissions:
  contents: read
  actions: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch previously generated draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/gemini-qa
          gh run download 38802121535 -R ${{ github.repository }} -n gemini-single-draft-dogs -D /tmp/gemini-qa
      - name: Check schema and provenance
        run: python tools/gemini_draft_static_qa.py /tmp/gemini-qa/gemini-draft.json evidence/approved/2026-10-16-gemini-draft.json
