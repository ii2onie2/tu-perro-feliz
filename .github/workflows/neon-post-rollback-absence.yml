name: Neon Post Rollback Absence Check
on:
  push:
    branches: [integration/indiepost-premium-audit-20261015]
    paths: [.github/workflows/neon-post-rollback-absence.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check 'psycopg[binary]>=3.2,<4'
      - run: python -m py_compile tools/neon_post_rollback_absence.py
      - name: Verify schema objects absent without writes
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: python tools/neon_post_rollback_absence.py
