name: TikTok operations preflight
on:
  workflow_dispatch:
  schedule:
    - cron: '17 7 * * *'
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fail closed on missing or unapproved editorial inputs
        shell: bash
        run: |
          set -euo pipefail
          DAY="$(TZ=Europe/Madrid date +%F)"
          echo "EDITORIAL_DATE=$DAY"
          echo "MODE=READ_ONLY"
          echo "PUBLISH_ATTEMPTS=0"
          python - "$DAY" <<'PY'
          import json, pathlib, sys
          day=sys.argv[1]
          expected=[
              (f"content/{day}.json","Tu perro feliz","10:00"),
              (f"content/{day}-educacion.json","Buenos modales","16:00"),
              (f"content/{day}-sabias.json","¿Sabías esto de tu perro?","19:00"),
          ]
          for name,series,slot in expected:
              p=pathlib.Path(name)
              if not p.is_file() or p.stat().st_size==0:
                  sys.exit(f"BLOCKED_MISSING_EDITORIAL_INPUT={name}")
              data=json.loads(p.read_text(encoding="utf-8"))
              if not isinstance(data,dict) or any((data.get("date")!=day,data.get("series")!=series,data.get("slot")!=slot)):
                  sys.exit(f"BLOCKED_WRONG_DATE_SERIES_OR_SLOT={name}")
              # Explicit positive approval is required. Missing or unknown
              # values must never be interpreted as approval.
              approved={
                  "editorial_status":"APPROVED",
                  "media_rights_status":"VERIFIED",
                  "publishing_status":"READY",
              }
              for key,required in approved.items():
                  value=data.get(key)
                  if not isinstance(value,str) or value.strip().upper()!=required:
                      sys.exit(f"BLOCKED_APPROVAL_NOT_PROVEN={name}:{key}")
          print("DAILY_INPUT_METADATA=PASS")
          PY
          python scripts/validate_content.py "content/$DAY.json" "content/$DAY-educacion.json" "content/$DAY-sabias.json"
          echo "SCHEMA_PREFLIGHT=PASS_NOT_PUBLICATION_CLEARANCE"
          echo "MEDIA_RIGHTS_AND_METRICOOL_GATES=NOT_VERIFIED"
