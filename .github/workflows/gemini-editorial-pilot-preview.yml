name: Gemini Editorial Pilot MP4 - Preview Only
on:
  push:
    branches:
      - integration/indiepost-premium-audit-20261015
    paths:
      - ".github/workflows/gemini-editorial-pilot-preview.yml"
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install piper-tts
      - name: Download Spanish TTS voice
        run: |
          mkdir -p voices
          curl -fsSL --retry 3 -o voices/es_ES-sharvard-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/sharvard/medium/es_ES-sharvard-medium.onnx
          curl -fsSL --retry 3 -o voices/es_ES-sharvard-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/sharvard/medium/es_ES-sharvard-medium.onnx.json
      - name: Verify reviewed draft and render non-publishable preview
        env:
          PIPER_VOICE_MODEL: voices/es_ES-sharvard-medium.onnx
          PIPER_VOICE_CONFIG: voices/es_ES-sharvard-medium.onnx.json
        run: |
          python - <<'PY'
          import json,re
          data=json.load(open("pilots/2026-10-16-editorial.json"))
          assert data["status"] == "EDITORIALLY_REVISED_PILOT_NO_PUBLICATION"
          assert data["publication_approved"] is False
          assert data["media_license_approved"] is False
          words=len(re.findall(r"\b\w+\b",data["narration"]))
          low,high=(180,240) if data["series"]=="Tal Día Como Hoy" else (100,150)
          assert low<=words<=high,(words,low,high)
          assert len(data["sources"])>=2
          print("EDITORIAL_WORDS="+str(words))
          print("PUBLICATION_ALLOWED=NO")
          print("PREVIEW_VIDEO_ONLY=YES")
          PY
          python scripts/render.py --content pilots/2026-10-16-editorial.json --out out/gemini-editorial-pilot
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 out/gemini-editorial-pilot/video.mp4
          test -s out/gemini-editorial-pilot/video.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: gemini-editorial-mp4-preview-only
          path: out/gemini-editorial-pilot/
          retention-days: 7
