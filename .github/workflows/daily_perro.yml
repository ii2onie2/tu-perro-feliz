name: Daily Dog Video (Tu Perro)

on:
  schedule:
    - cron: '0 7,14,18 * * *'
  workflow_dispatch:

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests ollama

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install espeak-ng from source
        run: |
          git clone --depth 1 https://github.com/rhasspy/espeak-ng.git
          cd espeak-ng
          ./autogen.sh && ./configure --prefix=/usr && make -j$(nproc) && sudo make install && sudo ldconfig

      - name: Install Piper TTS
        run: |
          wget https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
          tar -xzf piper_linux_x86_64.tar.gz
          sudo cp piper/piper /usr/local/bin/
          sudo cp piper/libpiper_phonemize.so* /usr/lib/ 2>/dev/null || true
          sudo cp piper/libonnxruntime.so* /usr/lib/ 2>/dev/null || true
          sudo ldconfig

      - name: Download Voice Model
        run: |
          mkdir -p voices
          wget -O voices/es_ES-davefx-medium.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/davefx/medium/es_ES-davefx-medium.onnx"
          wget -O voices/es_ES-davefx-medium.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/davefx/medium/es_ES-davefx-medium.onnx.json"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Generate Content
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            if curl -s http://localhost:11434/api/tags > /dev/null; then break; fi
            sleep 2
          done
          ollama pull llama3.2:3b
          export CONTENT_FILE=content/episode_$(date +%Y%m%d_%H%M%S).json
          echo "CONTENT_FILE=$CONTENT_FILE" >> $GITHUB_ENV
          python generer_script_perro.py "$CONTENT_FILE"

      - name: Fetch Image
        env:
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
        run: python fetch_image.py "$CONTENT_FILE"

      - name: Render Video
        env:
          ESPEAK_DATA_PATH: /usr/share/espeak-ng-data
          PIPER_VOICE_MODEL: "voices/es_ES-davefx-medium.onnx"
        run: python scripts/render.py --content "$CONTENT_FILE" --out final_video

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v-$(date +%Y%m%d%H%M%S)"
          gh release create "$TAG" final_video/video.mp4 --title "Episode $(date +%d/%m/%Y)" --notes "Nouvel épisode généré automatiquement."
          echo "VIDEO_URL=${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/video.mp4" >> $GITHUB_ENV

      - name: Publish to Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python publier.py perro "$CONTENT_FILE" "$VIDEO_URL"

      - name: Commit and Push History
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add last_images.txt content/*.json || true
          git commit -m "chore: update history and content [skip ci]" || true
          git pull --rebase -X theirs
          git push
