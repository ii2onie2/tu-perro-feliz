name: Neon Publisher Readonly Credential Audit
on:
  push:
    branches: [integration/indiepost-premium-audit-20261015]
    paths: [.github/workflows/neon-publisher-credential-audit.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Verify least privilege credential
        env:
          NEON_PUBLISHER_DATABASE_URL: ${{ secrets.NEON_PUBLISHER_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os,psycopg
          dsn=os.environ['NEON_PUBLISHER_DATABASE_URL']
          with psycopg.connect(dsn,connect_timeout=15,options='-c default_transaction_read_only=on') as db:
              db.read_only=True
              with db.cursor() as c:
                  c.execute("""SELECT current_user,current_database(),
                   has_schema_privilege(current_user,'tiktok_autopilot','USAGE'),
                   has_table_privilege(current_user,'tiktok_autopilot.publication_reservations','SELECT'),
                   has_table_privilege(current_user,'tiktok_autopilot.publication_reservations','INSERT'),
                   has_table_privilege(current_user,'tiktok_autopilot.publication_reservations','UPDATE'),
                   has_table_privilege(current_user,'tiktok_autopilot.publication_reservations','DELETE'),
                   has_table_privilege(current_user,'tiktok_autopilot.publication_reservations','TRUNCATE'),
                   has_database_privilege(current_user,current_database(),'CREATE'),
                   pg_has_role(current_user,'neon_superuser','MEMBER')""")
                  row=c.fetchone()
                  assert row==('tiktok_publisher_limited','neondb',True,True,True,True,False,False,False,False), 'ROLE_POLICY_MISMATCH'
                  c.execute('SELECT count(*) FROM tiktok_autopilot.publication_reservations')
                  print('LEDGER_READ=PASS')
          print('ROLE_POLICY=PASS')
          print('DATABASE_WRITE=NO')
          print('RESULT=PASS_PUBLISHER_READONLY')
          PY
