name: Daily Content Readiness
on:
  workflow_dispatch:
    inputs:
      date:
        description: Local date YYYY-MM-DD
        required: true
  schedule:
    - cron: '15 6 * * *'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check daily JSON file
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          DAY="${REQUESTED_DATE:-$(TZ=Europe/Madrid date +%F)}"
          [[ "$DAY" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]] || exit 1
          missing=0
          for FILE in "content/$DAY.json"; do
            if [ ! -s "$FILE" ]; then
              echo "::error file=$FILE::Missing daily editorial JSON. No fallback to old content."
              missing=1
            else
              echo "FOUND=$FILE"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "RESULT=BLOCKED_MISSING_EDITORIAL_INPUTS"
            exit 1
          fi
          echo "RESULT=READY_FOR_CONTENT_VALIDATION"
      - name: Validate present daily JSONs and editorial sources
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          DAY="${REQUESTED_DATE:-$(TZ=Europe/Madrid date +%F)}"
          python - "$DAY" <<'PY'
          import datetime
          import json
          import pathlib
          import sys
          date = datetime.date.fromisoformat(sys.argv[1]).isoformat()
          suffixes = ("",)
          for suffix in suffixes:
              path = pathlib.Path("content") / (date + suffix + ".json")
              with path.open(encoding="utf-8") as stream:
                  data = json.load(stream)
              if not isinstance(data, dict):
                  raise ValueError(f"{path}: expected object")
              if data.get("date") != date:
                  raise ValueError(f"{path}: mismatched date")
              for key in ("title", "narration", "sources"):
                  if not data.get(key):
                      raise ValueError(f"{path}: missing {key}")
              if not isinstance(data["sources"], list) or not all(isinstance(s, (str, dict)) for s in data["sources"]):
                  raise ValueError(f"{path}: invalid sources")
              print(f"JSON_CHECK=PASS FILE={path}")
          PY
      - name: Run canonical editorial content validator
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          DAY="${REQUESTED_DATE:-$(TZ=Europe/Madrid date +%F)}"
          python scripts/validate_content.py "content/$DAY.json"
