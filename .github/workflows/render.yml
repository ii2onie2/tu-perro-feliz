name: Render Tu Perro Feliz videos

on:
  workflow_dispatch:
    inputs:
      content_file:
        description: JSON content file to render
        required: true
      publish_to_repo:
        description: Explicitly allow repository write after successful rendering (not TikTok publication)
        type: boolean
        required: true
        default: false
  push:
    branches:
      - main
    paths:
      - "content/*.json"
      - "scripts/**"
      - ".github/workflows/render.yml"
  schedule:
    - cron: "45 6 * * *"

permissions:
  contents: read

concurrency:
  group: tu-perro-feliz-render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies and Piper
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install piper-tts

      - name: Resolve content files
        id: content
        shell: bash
        run: |
          : > render_list.txt
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILE="${{ inputs.content_file }}"
            if [[ ! "$FILE" =~ ^content/[0-9]{4}-[0-9]{2}-[0-9]{2}(-[A-Za-z0-9_-]+)?[.]json$ ]]; then
              echo "::error::Manual input must be a dated content JSON path."
              exit 1
            fi
            test -s "$FILE"
            printf '%s\n' "$FILE" >> render_list.txt
          elif [ "${{ github.event_name }}" = "push" ]; then
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" > changed_files.txt
            grep -E '^content/20[0-9]{2}-[0-9]{2}-[0-9]{2}(-[A-Za-z0-9_-]+)?\.json$' changed_files.txt >> render_list.txt || true
            if [ ! -s render_list.txt ]; then
              echo "::notice::No changed daily editorial JSON; skip rendering (no historical fallback)."
            fi
          else
            TODAY=$(TZ=Europe/Madrid date +%F)
            MISSING=0
            for FILE in "content/${TODAY}.json"; do
              if [ ! -s "$FILE" ]; then
                echo "::error file=$FILE::Missing or empty daily JSON."
                MISSING=1
              else
                printf '%s\n' "$FILE" >> render_list.txt
              fi
            done
            if [ "$MISSING" -ne 0 ]; then
              exit 1
            fi
          fi
          sort -u -o render_list.txt render_list.txt
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          cat render_list.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Validate content quality
        if: steps.content.outputs.files != ''
        shell: bash
        run: |
          mapfile -t FILES < render_list.txt
          python scripts/validate_content.py "${FILES[@]}"
          for FILE in "${FILES[@]}"; do
            python scripts/select_format.py "$FILE"
          done

      - name: Download Spanish Piper voice
        if: steps.content.outputs.files != ''
        run: |
          mkdir -p voices
          curl -L --fail -o voices/es_ES-sharvard-medium.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/sharvard/medium/es_ES-sharvard-medium.onnx
          curl -L --fail -o voices/es_ES-sharvard-medium.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_ES/sharvard/medium/es_ES-sharvard-medium.onnx.json

      - name: Render all resolved content files
        if: steps.content.outputs.files != ''
        env:
          PIPER_VOICE_MODEL: voices/es_ES-sharvard-medium.onnx
          PIPER_VOICE_CONFIG: voices/es_ES-sharvard-medium.onnx.json
        shell: bash
        run: |
          python scripts/growth_plan.py || true
          mapfile -t FILES < render_list.txt
          for FILE in "${FILES[@]}"; do
            STEM=$(basename "$FILE" .json)
            MEDIA_DIR="media/$STEM"
            OUT_DIR="out/$STEM"
            mkdir -p "$MEDIA_DIR" "$OUT_DIR"
            python scripts/fetch_media.py --content "$FILE" --out "$MEDIA_DIR"
            python scripts/render.py --content "$FILE" --out "$OUT_DIR"
            test -s "$OUT_DIR/video.mp4"
            test -s "$OUT_DIR/caption.txt"
            test -s "$OUT_DIR/sources.json"
          done

      - name: Upload video packages
        if: always() && steps.content.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: tu-perro-feliz-${{ github.run_id }}
          path: |
            out/
            media/
            render_list.txt
          retention-days: 30

  publish:
    needs: render
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_to_repo == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/download-artifact@v4
        with:
          name: tu-perro-feliz-${{ github.run_id }}
          path: .
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish rendered MP4s in repository
        shell: bash
        run: |
          mkdir -p videos
          mapfile -t FILES < render_list.txt
          for FILE in "${FILES[@]}"; do
            STEM=$(basename "$FILE" .json)
            cp "out/$STEM/video.mp4" "videos/$STEM.mp4"
            cp "out/$STEM/caption.txt" "videos/$STEM.caption.txt"
            cp "out/$STEM/sources.json" "videos/$STEM.sources.json"
            if [ -f "media/$STEM/credits.json" ]; then
              cp "media/$STEM/credits.json" "videos/$STEM.credits.json"
            fi
          done
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Git writes permitted only on main."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --worktree -- content/ || true
          python scripts/update_history.py "${FILES[@]}"
          git add videos/ content/published_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish Tu Perro Feliz videos"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

