name: Editorial Source and Model Candidates
on:
  push:
    branches: [integration/indiepost-premium-audit-20261015]
    paths:
      - 'tools/editorial_candidate_connectors.py'
      - '.github/workflows/editorial-source-model-candidates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Collect sources and optional model suggestions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_API_TOKEN: ${{ secrets.OLLAMA_API_TOKEN }}
          OLLAMA_URL: ${{ vars.OLLAMA_URL }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          BRAND: dogs
        run: python tools/editorial_candidate_connectors.py --brand "$BRAND"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-source-model-candidates
          path: out/editorial-discovery/
          retention-days: 7
