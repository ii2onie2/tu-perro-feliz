name: Editorial Source and Model Candidates
on:
  push:
    branches: [integration/indiepost-premium-audit-20261015]
    paths:
      - 'tools/editorial_candidate_connectors.py'
      - 'tools/editorial_research_dossiers.py'
      - '.github/workflows/editorial-source-model-candidates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Collect sources and optional model suggestions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OLLAMA_API_TOKEN: ${{ secrets.OLLAMA_API_TOKEN }}
          OLLAMA_URL: ${{ vars.OLLAMA_URL }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          REQUIRE_GEMINI: '1'
          BRAND: dogs
        run: python tools/editorial_candidate_connectors.py --brand "$BRAND"
      - name: Build unapproved research dossiers
        if: always()
        run: |
          if test -f out/editorial-discovery/candidates.json && test -f out/editorial-discovery/gemini-ideas.json; then
            python tools/editorial_research_dossiers.py
          else
            echo 'RESEARCH_PACKET=BLOCKED_MISSING_CANDIDATES'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-source-model-candidates
          path: out/editorial-discovery/
          retention-days: 7
