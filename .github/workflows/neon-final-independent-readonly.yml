name: Neon Final Independent Readonly
on:
  push:
    branches: [integration/indiepost-premium-audit-20261015]
    paths: [.github/workflows/neon-final-independent-readonly.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Check expected Neon catalog state
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          python - <<'PY'
          import os,psycopg,hashlib,pathlib
          for name in ["sql/neon_reservation_schema_v1.sql","sql/neon_role_grants_v1_proposal.sql"]:
              print("SQL_SHA256="+hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest())
          with psycopg.connect(os.environ["NEON_DATABASE_URL"],options="-c default_transaction_read_only=on") as db:
              db.read_only=True
              with db.cursor() as c:
                  c.execute("SELECT to_regnamespace('tiktok_autopilot'),to_regclass('tiktok_autopilot.publication_reservations'),EXISTS(SELECT 1 FROM pg_roles WHERE rolname='tiktok_reservation_rw')")
                  schema,table,role=c.fetchone()
                  assert schema is None and table is None and role is False
          print("RESULT=PASS_FINAL_READ_ONLY")
          PY
