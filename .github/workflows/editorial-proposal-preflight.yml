name: Editorial proposal preflight
on:
  pull_request:
    paths:
      - 'editorial/proposals/*.json'
      - 'scripts/check_editorial_proposal.py'
      - '.github/workflows/editorial-proposal-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate proposal metadata without publication
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in editorial/proposals/*.json; do
            python scripts/check_editorial_proposal.py "$file"
          done
          echo "EDITORIAL_PROPOSAL_PREFLIGHT=PASS"
